[package]
name = "snapllm-desktop"
version = "1.17.33"
description = "SnapLLM Desktop - Multi-Model LLM Serving Platform"
authors = ["SnapLLM Team"]
license = "MIT"
repository = "https://github.com/snapllm/snapllm"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# this feature is used for production builds with the bundled custom protocol
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
