services:
  snapllm:
    image: maheshvaikri/snapllm:1.17.33
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SNAPLLM_VERSION: "1.17.33"
        SNAPLLM_CUDA: "OFF"
        SNAPLLM_ENABLE_DIFFUSION: "ON"
        SNAPLLM_ENABLE_MULTIMODAL: "ON"
    ports:
      - "127.0.0.1:6930:6930"
    command: ["snapllm", "--server", "--host", "0.0.0.0", "--port", "6930", "--workspace-root", "/workspace", "--cors-origin", "http://localhost:9780", "--cors-origin", "http://127.0.0.1:9780"]
    environment:
      SNAPLLM_API_KEY: "${SNAPLLM_API_KEY:?Set SNAPLLM_API_KEY to at least 32 visible ASCII characters}"
      SNAPLLM_NETWORK_GUARD: "loopback-port-publish"
      SNAPLLM_MODELS_PATH: "/models"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - ./workspace:/workspace
      - "${SNAPLLM_HOST_MODELS_PATH:-./models}:/models:ro"
      - ./config:/app/.config/snapllm
  snapllm-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_API_URL: "http://localhost:6930"
    image: maheshvaikri/snapllm-ui:1.17.33
    depends_on:
      snapllm:
        condition: service_healthy
    ports:
      - "127.0.0.1:9780:80"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
