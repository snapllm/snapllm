services:
  snapllm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SNAPLLM_CUDA: "OFF"
        SNAPLLM_ENABLE_DIFFUSION: "ON"
        SNAPLLM_ENABLE_MULTIMODAL: "ON"
    ports:
      - "127.0.0.1:6930:6930"
    command: ["snapllm", "--server", "--host", "0.0.0.0", "--port", "6930", "--workspace-root", "/workspace"]
    environment:
      SNAPLLM_API_KEY: "${SNAPLLM_API_KEY:?Set SNAPLLM_API_KEY to at least 32 visible ASCII characters}"
      SNAPLLM_NETWORK_GUARD: "loopback-port-publish"
      SNAPLLM_MODELS_PATH: "/models"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - ./workspace:/workspace
      - ./models:/models:ro
