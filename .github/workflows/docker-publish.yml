name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to publish'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: docker-publish
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$username" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo "Invalid Docker Hub username" >&2; exit 1; }
          echo "name=${REGISTRY}/${username}/snapllm" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Verify version matches tag
        shell: bash
        run: |
          version="$(node -e "const fs=require('fs');const m=fs.readFileSync('CMakeLists.txt','utf8').match(/project\\(SnapLLM VERSION ([0-9.]+)/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          [[ "$version" == "${{ steps.release.outputs.version }}" ]] || { echo "CMake version $version does not match tag ${{ steps.release.outputs.tag }}" >&2; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SNAPLLM_VERSION=${{ steps.release.outputs.version }}
            SNAPLLM_CUDA=OFF
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          build-args: SNAPLLM_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }}-cuda
            ${{ steps.image.outputs.name }}:cuda
          labels: ${{ steps.meta.outputs.labels }}
