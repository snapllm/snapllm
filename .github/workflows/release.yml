name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify release tag
        id: verify-tag
        shell: bash
        run: |
          # Release tags are validated by exact name and commit resolution.
          # Signed-tag verification is intentionally optional for this repository;
          # the maintainer approved publishing the existing lightweight tag.
          if git cat-file -e "${RELEASE_TAG}^{commit}"; then
            echo "Release tag resolves to $(git rev-parse "${RELEASE_TAG}^{commit}")"
          else
            echo "Release tag does not resolve to a commit" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify source and tag versions
        shell: bash
        run: |
          node scripts/check_versions.mjs
          SOURCE_VERSION="$(sed -nE 's/.*project\(SnapLLM VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test "v${SOURCE_VERSION}" = "${RELEASE_TAG}"

  build-ui:
    runs-on: ubuntu-latest
    needs: [validate-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm --prefix desktop-app ci
      - name: Dependency audit
        run: npm --prefix desktop-app run audit
      - name: Unit tests
        run: npm --prefix desktop-app test -- --run
      - name: Lint
        run: npm --prefix desktop-app run lint
      - name: Type check
        run: cd desktop-app && npx tsc --noEmit
      - name: Build Web UI
        run: npm --prefix desktop-app run build
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # Tauri 2 uses WebKitGTK 4.1 and libsoup3. Keep the native package
          # set aligned with the Rust lockfile; omitting libsoup3 makes the
          # desktop build fail during webkit2gtk-sys detection.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          for pc in javascriptcoregtk webkit2gtk webkit2gtk-web-extension; do
            if [ -f "/usr/lib/x86_64-linux-gnu/pkgconfig/${pc}-4.1.pc" ]; then
              sudo ln -sf "${pc}-4.1.pc" "/usr/lib/x86_64-linux-gnu/pkgconfig/${pc}-4.0.pc"
            fi
          done
          for lib in javascriptcoregtk webkit2gtk; do
            if [ -e "/usr/lib/x86_64-linux-gnu/lib${lib}-4.1.so" ]; then
              sudo ln -sf "lib${lib}-4.1.so" "/usr/lib/x86_64-linux-gnu/lib${lib}-4.0.so"
            fi
          done
      - name: Rust formatting
        run: cargo fmt --manifest-path desktop-app/src-tauri/Cargo.toml --check
      - name: Rust check and tests
        run: |
          cargo check --manifest-path desktop-app/src-tauri/Cargo.toml --locked
          cargo test --manifest-path desktop-app/src-tauri/Cargo.toml --locked
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust dependency audit
        run: cargo audit --file desktop-app/src-tauri/Cargo.lock
      - name: Verify build
        run: |
          test -f desktop-app/dist/index.html || { echo "index.html not found"; exit 1; }
          ls -lhR desktop-app/dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-ui
          path: desktop-app/dist/
          retention-days: 1

  build-windows:
    runs-on: windows-2022
    needs: [validate-release, build-ui]
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: >-
          cmake -S . -B build_cpu -G "Visual Studio 17 2022" -A x64
          -DSNAPLLM_CUDA=OFF
          -DSNAPLLM_AVX2=ON
          -DSNAPLLM_OPENMP=ON
          -DSNAPLLM_ENABLE_DIFFUSION=ON
          -DSNAPLLM_ENABLE_MULTIMODAL=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_cpu --config Release -j 2
      - name: Regression tests
        run: ctest --test-dir build_cpu -C Release --output-on-failure
      - name: HTTP security integration
        shell: pwsh
        run: tests/server_security_integration.ps1 -ServerExecutable build_cpu/bin/snapllm.exe
      - name: Verify binary
        shell: pwsh
        run: |
          if (!(Test-Path "build_cpu\bin\snapllm.exe")) {
            Write-Error "Binary not found at build_cpu\bin\snapllm.exe"
            Get-ChildItem -Recurse build_cpu\bin\ -ErrorAction SilentlyContinue
            Get-ChildItem -Recurse build_cpu\Release\ -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Binary found: build_cpu\bin\snapllm.exe"
      - name: Smoke test
        run: powershell -File scripts/ci_smoke_test.ps1 -SnapllmPath build_cpu\bin\snapllm.exe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-ui
          path: web-ui-dist/
      - name: Package release
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $rel = "snapllm-${env:VERSION}-windows-x64-cpu"
          $dir = "release-pkg\$rel"
          New-Item -ItemType Directory -Force -Path "$dir\bin"
          New-Item -ItemType Directory -Force -Path "$dir\examples"
          New-Item -ItemType Directory -Force -Path "$dir\docs"
          New-Item -ItemType Directory -Force -Path "$dir\ui"

          # Binary
          Copy-Item "build_cpu\bin\snapllm.exe" "$dir\bin\"

          # Web UI
          Copy-Item "web-ui-dist\*" "$dir\ui\" -Recurse -Force

          # Docs
          Copy-Item "README.md" "$dir\" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$dir\" -ErrorAction SilentlyContinue
          Copy-Item "QUICKSTART.md" "$dir\" -ErrorAction SilentlyContinue
          Copy-Item "docs\*.md" "$dir\docs\" -ErrorAction SilentlyContinue

          # Examples
          Copy-Item "examples\*.py" "$dir\examples\" -ErrorAction SilentlyContinue
          Copy-Item "examples\README.md" "$dir\examples\" -ErrorAction SilentlyContinue

          # Start scripts
          @"
          @echo off
          echo Starting SnapLLM Server with Web UI...
          echo.
          cd /d "%~dp0"
          echo Web UI will be available at: http://localhost:6930/
          echo.
          bin\snapllm.exe --server --port 6930 --ui-dir ui %*
          pause
          "@ | Set-Content "$dir\run_server.bat"

          @'
          $ErrorActionPreference = "Stop"
          Set-Location $PSScriptRoot
          $modelPath = Read-Host "Enter path to your .gguf model file"
          $modelName = Read-Host "Enter a name for this model"
          if ($modelName -notmatch '^[A-Za-z0-9_.-]{1,128}$') {
            throw "Model name may contain only letters, digits, dot, underscore, and hyphen."
          }
          if ([IO.Path]::GetExtension($modelPath) -ine ".gguf" -or -not (Test-Path -LiteralPath $modelPath -PathType Leaf)) {
            throw "Model path must identify an existing .gguf file."
          }
          Write-Host "Starting server with model: $modelName"
          Write-Host "Web UI will be available at: http://localhost:6930/"
          & "$PSScriptRoot\bin\snapllm.exe" --server --port 6930 --ui-dir ui --load-model $modelName $modelPath
          '@ | Set-Content "$dir\run_server_with_model.ps1"

          # Version file
          $env:VERSION | Set-Content "$dir\VERSION"

          # Create ZIP
          Compress-Archive -Path "$dir\*" -DestinationPath "release-pkg\$rel.zip" -Force
          Write-Host "Created release-pkg\$rel.zip"
      - name: Smoke packaged archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem release-pkg/*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath release-smoke
          $binary = Get-ChildItem release-smoke -Recurse -Filter snapllm.exe | Select-Object -First 1
          $actual = (& $binary.FullName --version).Trim()
          $expected = "SnapLLM $($env:RELEASE_TAG.TrimStart('v'))"
          if ($actual -ne $expected) { throw "Packaged version '$actual' did not match '$expected'" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: release-pkg/*.zip
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    needs: [validate-release, build-ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: >-
          cmake -S . -B build_cpu
          -DSNAPLLM_CUDA=OFF
          -DSNAPLLM_AVX2=ON
          -DSNAPLLM_OPENMP=ON
          -DSNAPLLM_ENABLE_DIFFUSION=ON
          -DSNAPLLM_ENABLE_MULTIMODAL=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_cpu -j 2
      - name: Regression tests
        run: ctest --test-dir build_cpu --output-on-failure
      - name: Smoke test
        run: |
          chmod +x scripts/ci_smoke_test.sh
          bash scripts/ci_smoke_test.sh build_cpu/bin/snapllm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-ui
          path: web-ui-dist/
      - name: Package release
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          REL="snapllm-${VERSION}-linux-x64-cpu"
          DIR="release-pkg/${REL}"
          mkdir -p "${DIR}/bin" "${DIR}/examples" "${DIR}/docs" "${DIR}/lib" "${DIR}/ui"

          # Binary
          cp build_cpu/bin/snapllm "${DIR}/bin/"
          chmod +x "${DIR}/bin/snapllm"

          # Web UI
          cp -r web-ui-dist/* "${DIR}/ui/"

          # Shared libs (if any)
          cp build_cpu/lib/*.so* "${DIR}/lib/" 2>/dev/null || true

          # Docs
          cp README.md "${DIR}/" 2>/dev/null || true
          cp LICENSE "${DIR}/" 2>/dev/null || true
          cp QUICKSTART.md "${DIR}/" 2>/dev/null || true
          cp docs/*.md "${DIR}/docs/" 2>/dev/null || true

          # Examples
          cp examples/*.py "${DIR}/examples/" 2>/dev/null || true
          cp examples/README.md "${DIR}/examples/" 2>/dev/null || true

          # Start scripts
          cat > "${DIR}/run_server.sh" << 'SCRIPT'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${LD_LIBRARY_PATH}"
          echo "Starting SnapLLM Server with Web UI..."
          echo "Web UI will be available at: http://localhost:6930/"
          exec "${SCRIPT_DIR}/bin/snapllm" --server --port 6930 --ui-dir "${SCRIPT_DIR}/ui" "$@"
          SCRIPT
          chmod +x "${DIR}/run_server.sh"

          cat > "${DIR}/run_server_with_model.sh" << 'SCRIPT'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${LD_LIBRARY_PATH}"
          echo ""
          echo " SnapLLM Server with Model"
          echo " ========================="
          echo ""
          read -p "Enter path to your .gguf model file: " MODEL_PATH
          read -p "Enter a name for this model: " MODEL_NAME
          echo ""
          echo "Starting server with model: ${MODEL_NAME}"
          echo "Web UI will be available at: http://localhost:6930/"
          exec "${SCRIPT_DIR}/bin/snapllm" --server --port 6930 --ui-dir "${SCRIPT_DIR}/ui" --load-model "${MODEL_NAME}" "${MODEL_PATH}"
          SCRIPT
          chmod +x "${DIR}/run_server_with_model.sh"

          # Version file
          echo "${VERSION}" > "${DIR}/VERSION"

          # Create tarball
          cd release-pkg
          tar -czvf "${REL}.tar.gz" "${REL}"
          echo "Created release-pkg/${REL}.tar.gz"
      - name: Smoke packaged archive
        shell: bash
        run: |
          mkdir release-smoke
          tar -xzf release-pkg/*.tar.gz -C release-smoke
          BINARY="$(find release-smoke -type f -path '*/bin/snapllm' -print -quit)"
          test -n "${BINARY}"
          test "$("${BINARY}" --version)" = "SnapLLM ${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: release-pkg/*.tar.gz
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    needs: [validate-release, build-ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: >-
          cmake -S . -B build_cpu
          -DSNAPLLM_CUDA=OFF
          -DSNAPLLM_AVX2=OFF
          -DSNAPLLM_OPENMP=OFF
          -DSNAPLLM_ENABLE_DIFFUSION=ON
          -DSNAPLLM_ENABLE_MULTIMODAL=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_cpu -j 3
      - name: Regression tests
        run: ctest --test-dir build_cpu --output-on-failure
      - name: Smoke test
        run: |
          chmod +x scripts/ci_smoke_test.sh
          bash scripts/ci_smoke_test.sh build_cpu/bin/snapllm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-ui
          path: web-ui-dist/
      - name: Package release
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          REL="snapllm-${VERSION}-macos-arm64"
          DIR="release-pkg/${REL}"
          mkdir -p "${DIR}/bin" "${DIR}/examples" "${DIR}/docs" "${DIR}/lib" "${DIR}/ui"

          # Binary
          cp build_cpu/bin/snapllm "${DIR}/bin/"
          chmod +x "${DIR}/bin/snapllm"

          # Web UI
          cp -r web-ui-dist/* "${DIR}/ui/"

          # Shared libs (if any)
          cp build_cpu/lib/*.dylib "${DIR}/lib/" 2>/dev/null || true

          # Docs
          cp README.md "${DIR}/" 2>/dev/null || true
          cp LICENSE "${DIR}/" 2>/dev/null || true
          cp QUICKSTART.md "${DIR}/" 2>/dev/null || true
          cp docs/*.md "${DIR}/docs/" 2>/dev/null || true

          # Examples
          cp examples/*.py "${DIR}/examples/" 2>/dev/null || true
          cp examples/README.md "${DIR}/examples/" 2>/dev/null || true

          # Start scripts
          cat > "${DIR}/run_server.sh" << 'SCRIPT'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export DYLD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${DYLD_LIBRARY_PATH}"
          echo "Starting SnapLLM Server with Web UI..."
          echo "Web UI will be available at: http://localhost:6930/"
          exec "${SCRIPT_DIR}/bin/snapllm" --server --port 6930 --ui-dir "${SCRIPT_DIR}/ui" "$@"
          SCRIPT
          chmod +x "${DIR}/run_server.sh"

          cat > "${DIR}/run_server_with_model.sh" << 'SCRIPT'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export DYLD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${DYLD_LIBRARY_PATH}"
          echo ""
          echo " SnapLLM Server with Model"
          echo " ========================="
          echo ""
          read -p "Enter path to your .gguf model file: " MODEL_PATH
          read -p "Enter a name for this model: " MODEL_NAME
          echo ""
          echo "Starting server with model: ${MODEL_NAME}"
          echo "Web UI will be available at: http://localhost:6930/"
          exec "${SCRIPT_DIR}/bin/snapllm" --server --port 6930 --ui-dir "${SCRIPT_DIR}/ui" --load-model "${MODEL_NAME}" "${MODEL_PATH}"
          SCRIPT
          chmod +x "${DIR}/run_server_with_model.sh"

          # Version file
          echo "${VERSION}" > "${DIR}/VERSION"

          # Create tarball
          cd release-pkg
          tar -czvf "${REL}.tar.gz" "${REL}"
          echo "Created release-pkg/${REL}.tar.gz"
      - name: Smoke packaged archive
        shell: bash
        run: |
          mkdir release-smoke
          tar -xzf release-pkg/*.tar.gz -C release-smoke
          BINARY="$(find release-smoke -type f -path '*/bin/snapllm' -print -quit)"
          test -n "${BINARY}"
          test "$("${BINARY}" --version)" = "SnapLLM ${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: release-pkg/*.tar.gz
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: [validate-release, build-windows, build-linux, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: artifacts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: artifacts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: artifacts/
      - name: List artifacts
        run: ls -lhR artifacts/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${RELEASE_TAG#v}
          gh release create "${RELEASE_TAG}" \
            --target "${{ github.sha }}" \
            --title "SnapLLM v${VERSION}" \
            --generate-notes \
            --latest \
            artifacts/*
