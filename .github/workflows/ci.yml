name: CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    # Pin the image that includes the Visual Studio 2022 generator used below.
    runs-on: windows-2022
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Configure
        run: >-
          cmake -S . -B build_cpu -G "Visual Studio 17 2022" -A x64
          -DSNAPLLM_CUDA=OFF
          -DSNAPLLM_AVX2=ON
          -DSNAPLLM_OPENMP=ON
          -DSNAPLLM_ENABLE_DIFFUSION=ON
          -DSNAPLLM_ENABLE_MULTIMODAL=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_cpu --config Release -j 2
      - name: C++ regression tests
        run: ctest --test-dir build_cpu -C Release --output-on-failure
      - name: Verify binary exists
        run: |
          if (!(Test-Path "build_cpu\bin\snapllm.exe")) {
            Write-Error "Binary not found at build_cpu\bin\snapllm.exe"
            Get-ChildItem -Recurse build_cpu\bin\ -ErrorAction SilentlyContinue
            Get-ChildItem -Recurse build_cpu\Release\ -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Binary found: build_cpu\bin\snapllm.exe"
        shell: pwsh
      - name: Smoke Test
        run: >-
          powershell -File scripts/ci_smoke_test.ps1
          -SnapllmPath build_cpu\bin\snapllm.exe
      - name: HTTP security integration
        shell: pwsh
        run: tests/server_security_integration.ps1 -ServerExecutable build_cpu/bin/snapllm.exe
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install desktop test dependencies
        run: npm --prefix desktop-app ci
      - name: Install Playwright Chromium
        run: npm --prefix desktop-app exec -- playwright install chromium
      - name: Download pinned low-weight UI test model
        shell: pwsh
        run: |
          $modelDirectory = Join-Path $env:USERPROFILE "Models"
          New-Item -ItemType Directory -Force -Path $modelDirectory | Out-Null
          $modelPath = Join-Path $modelDirectory "stories260K.gguf"
          $modelUrl = "https://huggingface.co/ggml-org/tiny-llamas/resolve/6e091d820cbe8f22eeb604d136403eca290b8c1e/stories260K.gguf"
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath
          $expectedHash = "047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b"
          $actualHash = (Get-FileHash -LiteralPath $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "UI test model hash mismatch: $actualHash"
          }
          "SNAPLLM_E2E_MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Browser integration tests
        shell: pwsh
        run: |
          $server = Start-Process `
            -FilePath "build_cpu/bin/snapllm.exe" `
            -ArgumentList "--server --host 127.0.0.1 --port 6930 --cors-origin http://127.0.0.1:9780 --cors-origin http://localhost:9780" `
            -PassThru `
            -WindowStyle Hidden
          try {
            $ready = $false
            1..100 | ForEach-Object {
              if (-not $ready) {
                try {
                  $health = Invoke-RestMethod "http://127.0.0.1:6930/health"
                  $ready = $health.status -eq "ok"
                } catch {
                  Start-Sleep -Milliseconds 100
                }
              }
            }
            if (-not $ready) { throw "SnapLLM did not become ready" }
            npm --prefix desktop-app run test:e2e
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Configure
        run: >-
          cmake -S . -B build_cpu
          -DSNAPLLM_CUDA=OFF
          -DSNAPLLM_AVX2=ON
          -DSNAPLLM_OPENMP=ON
          -DSNAPLLM_ENABLE_DIFFUSION=ON
          -DSNAPLLM_ENABLE_MULTIMODAL=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_cpu -j 2
      - name: C++ regression tests
        run: ctest --test-dir build_cpu --output-on-failure
      - name: Smoke Test
        run: |
          chmod +x scripts/ci_smoke_test.sh
          bash scripts/ci_smoke_test.sh build_cpu/bin/snapllm

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Configure
        run: >-
          cmake -S . -B build_cpu
          -DSNAPLLM_CUDA=OFF
          -DSNAPLLM_AVX2=OFF
          -DSNAPLLM_OPENMP=OFF
          -DSNAPLLM_ENABLE_DIFFUSION=ON
          -DSNAPLLM_ENABLE_MULTIMODAL=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_cpu -j 3
      - name: C++ regression tests
        run: ctest --test-dir build_cpu --output-on-failure
      - name: Smoke Test
        run: |
          chmod +x scripts/ci_smoke_test.sh
          bash scripts/ci_smoke_test.sh build_cpu/bin/snapllm

  desktop-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: Unit tests
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup2.4-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust dependency audit
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Version consistency
        working-directory: ${{ github.workspace }}
        run: node scripts/check_versions.mjs

  bindings-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - name: Configure
        run: >-
          cmake -S . -B build_cpu
          -DSNAPLLM_CUDA=OFF
          -DSNAPLLM_AVX2=ON
          -DSNAPLLM_OPENMP=ON
          -DSNAPLLM_ENABLE_DIFFUSION=ON
          -DSNAPLLM_ENABLE_MULTIMODAL=ON
          -DSNAPLLM_ENABLE_PYTHON_BINDINGS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_cpu -j 2
      - name: Import Test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'build_cpu/python')
          import snapllm_bindings
          print('bindings_ok')
          PY
